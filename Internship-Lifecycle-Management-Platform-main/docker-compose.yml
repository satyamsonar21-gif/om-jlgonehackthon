version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ilmp_postgres
    environment:
      POSTGRES_DB: ilmp_dev
      POSTGRES_USER: ilmp
      POSTGRES_PASSWORD: ilmp_secret
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ilmp -d ilmp_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
